name: Release

# Push a tag like v1.6 to build a signed APK and publish it as a GitHub Release.
# Required repository secrets:
#   RB_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   RB_KEYSTORE_PASSWORD keystore password
#   RB_KEY_ALIAS         key alias
#   RB_KEY_PASSWORD      key password
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          RB_KEYSTORE_BASE64: ${{ secrets.RB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RB_KEYSTORE_BASE64" ]; then
            echo "::error::RB_KEYSTORE_BASE64 secret is missing, refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$RB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          RB_KEYSTORE_PASSWORD: ${{ secrets.RB_KEYSTORE_PASSWORD }}
          RB_KEY_ALIAS: ${{ secrets.RB_KEY_ALIAS }}
          RB_KEY_PASSWORD: ${{ secrets.RB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename and checksum
        run: |
          APK="reels-blocker-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            reels-blocker-*.apk
            reels-blocker-*.apk.sha256
          generate_release_notes: true
